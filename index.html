    <script>
      (function() {
        // 1. Prevent crashes when environment or third-party extensions attempt to set window.fetch
        // in iframe sandboxes where window.fetch is configured with a getter only.
        try {
          var originalFetch = window.fetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                     Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window) || {}, 'fetch') ||
                     (typeof Window !== 'undefined' && Object.getOwnPropertyDescriptor(Window.prototype, 'fetch'));

          if (desc && desc.get && !desc.set) {
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() {
                  return originalFetch;
                },
                set: function(fn) {
                  originalFetch = fn;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {
              if (typeof Window !== 'undefined' && Window.prototype) {
                try {
                  Object.defineProperty(Window.prototype, 'fetch', {
                    get: function() {
                      return originalFetch;
                    },
                    set: function(fn) {
                      originalFetch = fn;
                    },
                    configurable: true,
                    enumerable: true
                  });
                } catch (e2) {}
              }
            }
          }
        } catch (e) {}

        // Helper to check if an error is cross-origin or benign sandbox noise
        function isIgnorableError(msg, file, line) {
          if (!msg) return (!file && line === 0);
          var m = String(msg).toLowerCase();
          return (
            m === 'script error.' ||
            m === 'script error' ||
            m.indexOf('script error') !== -1 ||
            (m.indexOf('fetch') !== -1 && m.indexOf('getter') !== -1) ||
            m.indexOf('resizeobserver') !== -1 ||
            (!file && line === 0)
          );
        }

        // 2. Global window.onerror to suppress unhandled cross-origin / iframe script errors
        window.onerror = function(message, source, lineno, colno, error) {
          if (isIgnorableError(message, source, lineno)) {
            return true; // suppresses the error from bubbling to browser harness
          }
          return false;
        };

        // 3. Capture-phase error listener
        window.addEventListener('error', function(event) {
          if (!event) return;
          var msg = event.message || (event.error && event.error.message) || '';
          if (isIgnorableError(msg, event.filename, event.lineno)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);

        // 4. Catch and suppress unhandled promise rejections from third-party / cross-origin sources
        window.addEventListener('unhandledrejection', function(event) {
          if (!event) return;
          var reason = event.reason;
          var msg = (reason && (reason.message || reason)) ? String(reason.message || reason) : '';
          if (isIgnorableError(msg, '', 0) || msg.toLowerCase().indexOf('abort') !== -1) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);
      })();
    </script>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('obsidian_vault_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = true;
          if (savedTheme === 'light') {
            isDark = false;
          } else if (savedTheme === 'system') {
            isDark = systemDark;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
          var savedLang = localStorage.getItem('obsidian_vault_lang');
          if (savedLang) {
            document.documentElement.setAttribute('lang', savedLang);
          }
        } catch (e) {}
      })();
    </script>
