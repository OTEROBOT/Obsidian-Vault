      (function() {
        // 1. Install immediate error suppression before any other tag or script runs
        function isIgnorableError(msg) {
          if (!msg) return false;
          var m = String(msg).toLowerCase();
          return (
            m === 'script error.' ||
            m === 'script error' ||
            m.indexOf('script error') !== -1 ||
            (m.indexOf('fetch') !== -1 && (m.indexOf('getter') !== -1 || m.indexOf('cannot set property') !== -1 || m.indexOf('typeerror') !== -1)) ||
            m.indexOf('resizeobserver') !== -1
          );
        }

        window.onerror = function(message, source, lineno, colno, error) {
          var msg = String(message || (error && error.message) || '');
          if (isIgnorableError(msg)) {
            return true;
          }
          return false;
        };

        window.addEventListener('error', function(event) {
          if (!event) return;
          var msg = event.message || (event.error && event.error.message) || '';
          if (isIgnorableError(msg)) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (!event) return;
          var reason = event.reason;
          var msg = (reason && (reason.message || reason)) ? String(reason.message || reason) : '';
          if (isIgnorableError(msg) || msg.toLowerCase().indexOf('abort') !== -1) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
            return true;
          }
        }, true);

        // 2. Proactively install getter/setter for window.fetch so assignments like window.fetch = ... succeed seamlessly
        try {
          var _currentFetch = window.fetch;
          function installFetchSetter(target) {
            if (!target) return;
            try {
              var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
              if (!desc || (desc.get && !desc.set) || desc.configurable) {
                Object.defineProperty(target, 'fetch', {
                  get: function() {
                    return _currentFetch;
                  },
                  set: function(val) {
                    _currentFetch = val;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e) {}
          }

          if (typeof Window !== 'undefined' && Window.prototype) {
            installFetchSetter(Window.prototype);
          }
          installFetchSetter(window);
          try {
            installFetchSetter(Object.getPrototypeOf(window));
          } catch (eProto) {}
        } catch (eGlobal) {}
      })();
    </script>

    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('obsidian_vault_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = true;
          if (savedTheme === 'light') {
            isDark = false;
          } else if (savedTheme === 'system') {
            isDark = systemDark;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
          var savedLang = localStorage.getItem('obsidian_vault_lang');
          if (savedLang) {
            document.documentElement.setAttribute('lang', savedLang);
          }
        } catch (e) {}
      })();
    </script>
